[project]
name = "kosmos"
version = "0.1.0"
description = "Kosmos LMS — single-user local-first Life Management System (Stage 1.1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rmholston420" }]

dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    "pyrage>=1.1",
    "PyYAML>=6.0",
    "redis>=5.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "prometheus-client>=0.20",
    "qdrant-client>=1.11",
    "neo4j>=5.26",
    "graphiti-core>=0.5",
    "agent-memory-guard==0.2.2",
    "rfc8785>=0.1.4",
    "cryptography>=49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ports", "adapters", "adapters.llm", "adapters.llm.ollama", "adapters.llm.llama_swap", "adapters.search", "adapters.search.searxng", "adapters.event_bus", "adapters.event_bus.valkey", "adapters.secrets", "adapters.secrets.age_file", "adapters.observability", "adapters.observability.otel_stack", "adapters.vector", "adapters.vector.qdrant", "adapters.memory", "adapters.memory.dozerdb", "adapters.data", "adapters.data.filesystem"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["ports", "adapters", "kernel", "plugins"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
