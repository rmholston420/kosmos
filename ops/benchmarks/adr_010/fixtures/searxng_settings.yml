# SearXNG config for ADR-010 head-to-head eval.
# Deterministic engine list so AREX and ODR receive identical result surfaces.

use_default_settings: true

general:
  instance_name: "kosmos-adr010"
  privacypolicy_url: false
  contact_url: false
  donation_url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "kosmos-adr010-local-eval-only-not-a-real-secret"
  limiter: false            # single-user local eval; no rate limiting needed
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"

ui:
  static_use_hash: true

engines:
  # Pinned engine list — both contenders see identical result surfaces.
  # Selection: strong general-web + academic mix matching AREX BrowseComp
  # (search + google_scholar tools) and ODR default breadth.
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: arxiv
    disabled: false
  - name: google scholar
    disabled: false
  - name: github
    disabled: false
