# DeepSWE eval corpus manifest — Stage 3.9 (ADR-007-DeepSWE)
#
# Load-bearing pin: every field below is referenced by the Stage 3.9
# contract tests. Do NOT edit outside a superseding ADR or a fresh
# STATUS AMENDMENT on ADR-007-DeepSWE.

[corpus]
name = "deepswe"
description = "Filtered subset of the DeepSWE long-horizon coding-agent benchmark."
upstream_repo = "https://github.com/datacurve-ai/deep-swe"
upstream_commit = "e016041a6ccf8da29906afc9a3f5a8df940a1f78"
upstream_license = "Apache-2.0"
corpus_total_tasks = 113
sample_seed = 0
subset_size = 5

# The subset is the deterministic, license-cleared shortlist we run
# through Pier on Colossus. Q2=A per Stage 3.9 kickoff.
#
# Every entry MUST supply:
#   task_id            — DeepSWE task directory name under `tasks/`
#   language           — task.toml [metadata] language
#   upstream_repo      — task.toml [metadata] repository_url (normalized)
#   upstream_owner     — github owner
#   upstream_repo_name — github repo name
#   base_commit        — task.toml [metadata] base_commit_hash
#   spdx_license       — GitHub-reported SPDX id for the upstream repo
#                        (verified 2026-07-30 EDT; test asserts permissive)

