# Stage 3.14a — GitWorktreeSandboxAdapter sandbox root + boundary policy.
# See docs/adrs/ADR-079-stage-3-14a-sandbox-provider-port.md.
#
# StateDirectory creates /var/lib/kosmos/tektos/sandboxes owned by the
# kosmos-kernel service user at mode 0750 under systemd's own management,
# which is compatible with the unit's ProtectHome=read-only /
# ProtectSystem=strict lockdown.
#
# KOSMOS_SANDBOX_ENFORCE_BOUNDARY defaults to "1" (bubblewrap envelope
# per spec §156 subprocess boundary inheritance). Setting it to "0"
# additionally requires KOSMOS_SANDBOX_ALLOW_UNSAFE=1 at adapter
# construction (ADR-079 belt-and-suspenders); neither is set here so
# the adapter refuses any accidental unsafe wiring.

[Service]
Environment=KOSMOS_TEKTOS_SANDBOX_ROOT=/var/lib/kosmos/tektos/sandboxes
Environment=KOSMOS_SANDBOX_ENFORCE_BOUNDARY=1
StateDirectory=kosmos/tektos/sandboxes
StateDirectoryMode=0750
