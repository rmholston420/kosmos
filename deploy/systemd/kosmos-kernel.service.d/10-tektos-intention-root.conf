# Kosmos kernel — Tektos intention scaffolder writable root.
#
# ADR-077 (Stage 3.13): plugins/tektos/intention/ writes scaffolded
# OpenSpec change dirs (proposal.md + tasks.md) under an XDG-standard
# state directory. The default resolution is
#   $XDG_STATE_HOME/kosmos/tektos/intentions
# or ~/.local/state/kosmos/tektos/intentions.
#
# The kosmos-kernel unit runs with `ProtectHome=read-only`, which makes
# both defaults unwritable at runtime. This drop-in redirects the
# scaffolder to /var/lib/kosmos/tektos/intentions and asks systemd to
# create + own that directory each start (StateDirectory is added to
# ReadWritePaths automatically under ProtectSystem=strict).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/kosmos-kernel.service.d
#   sudo cp deploy/systemd/kosmos-kernel.service.d/10-tektos-intention-root.conf \
#     /etc/systemd/system/kosmos-kernel.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart kosmos-kernel

[Service]
Environment=KOSMOS_TEKTOS_INTENTION_ROOT=/var/lib/kosmos/tektos/intentions
StateDirectory=kosmos/tektos/intentions
StateDirectoryMode=0750
