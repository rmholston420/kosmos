# Kosmos kernel — APEX approval-record durable storage (ADR-078).
#
# Stage 3.13.2: the default APEX Storage adapter is InMemoryStorage,
# which is wiped on every process restart. That made Tektos plans
# (Stage 3.13/3.13.1) unusable across `systemctl restart kosmos-kernel`.
# Setting KOSMOS_APEX_DB_PATH opts the kernel into the aiosqlite-backed
# SqliteStorage adapter (schema idempotent, WAL journaling on connect).
#
# The kosmos-kernel unit runs with ProtectHome=read-only, so the DB
# lives under /var/lib/kosmos. StateDirectory=kosmos/apex asks systemd
# to auto-create + own the directory at 0750 and adds it to the unit's
# ReadWritePaths under ProtectSystem=strict.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/kosmos-kernel.service.d
#   sudo cp deploy/systemd/kosmos-kernel.service.d/20-apex-db-path.conf \
#     /etc/systemd/system/kosmos-kernel.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart kosmos-kernel

[Service]
Environment=KOSMOS_APEX_DB_PATH=/var/lib/kosmos/apex/approvals.sqlite
StateDirectory=kosmos/apex
StateDirectoryMode=0750
